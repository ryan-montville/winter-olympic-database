<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Redirecting...</title>
  <script>
    (function () {
      // For a project site like /winter-olympic-database/, the base is the first path segment.
      // For a user/org site at the domain root, set basePath = "/".
      const segments = window.location.pathname.split("/").filter(Boolean);
      const basePath = segments.length > 0 ? `/${segments[0]}/` : "/";

      const targetPath =
        window.location.pathname + window.location.search + window.location.hash;

      sessionStorage.setItem("spa_redirect_path", targetPath);
      window.location.replace(basePath);
    })();
  </script>
</head>
<body></body>
</html>
